# Hungry Pathing settings. Plain key = value lines; restart the game after editing.
#
# Every value below changes what beavers decide, so it changes the simulation. In a multiplayer game every
# player must run the same version of this mod with an identical copy of this file. The game log prints one
# "Simulation settings" line at startup; if two players' lines differ, their games will drift apart.

# Master switch. false leaves the game's own behavior untouched (the mod still loads and logs).
Enabled = true

# Which needs the mod plans for. Only needs satisfied by consumable goods in storages make sense here.
Needs = Hunger,Thirst

# Buffer, in hours before the need would hit zero, that a working beaver keeps in hand. 0 = use each need's
# HoursWarningThreshold from its blueprint (this mod ships Hunger and Thirst at 3). Bots use the same field
# in the base game; beavers ignore it there, which is what this mod changes.
WarningHours = 0

# Just-in-time: while working, leave for the closest stocked storage early enough to arrive with WarningHours
# still in hand, instead of waiting for the penalty. LeadHours bounds how early the walk time is looked at.
JustInTime = true
JustInTimeLeadHours = 4

# Pre-fuel: when food or water is at most NearFoodHours of walking away and the beaver would not last the
# rest of the shift plus WarningHours, top off now rather than after walking off to a far job.
PreFuel = true
PreFuelNearFoodHours = 0.5

# Builder job check: when a builder has just reserved a construction site and would run out before getting
# there, working a while, and walking back to a storage, they top off first if food is near. Uses the
# game's own "site unavailable" path to let the site go; another builder or the same one picks it up after.
BuilderJobCheck = true
BuilderJobWorkHours = 1.0

# While working, choose the closest stocked storage for the need at hand. The base game picks the food
# group that scores the most need points (bread beats berries whenever the Bread need has room) and only
# then the closest storage of that group, which sends builders across the map. Off duty, the game's own
# choice still applies, so variety is not lost. VarietyToleranceHours allows a higher-scoring food when it
# costs at most that much more walking.
WorkTimeClosestFood = true
VarietyToleranceHours = 0.25

# Apply the same closest-storage choice to the game's own penalty-state trips during working hours.
RedirectCriticalTrips = true

# Cost bounds. At most CandidateLimit storages (nearest by straight line) get a real path query per
# decision; a beaver that found nothing waits RetryHours before looking again.
CandidateLimit = 8
RetryHours = 0.5

# One summary line per in-game day in Player.log with how often each rule fired.
DailyReport = true

# One line per decision that changed a beaver's plan. Verbose; for tracking a problem down.
Diagnostics = false
