name: Tests

# The mod builds against the game's own assemblies, which cannot be redistributed, so this runs the checks that need
# no game files: the planner checks (tests/HungryPathing.Tests.csproj compiles source/Planning on its own, with no
# package references) and the site checks (tests/test-site.mjs: Node only, no packages, no network).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 8.0.x
      # The runner may also have newer SDKs, and without a global.json the dotnet CLI picks the newest. Pin the one
      # just installed, on the runner only (a global.json in the repository would also pin developers' mod builds).
      - name: Pin the .NET 8 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Planner checks
        run: dotnet run --project tests/HungryPathing.Tests.csproj -c Release
      # Runs even when the planner checks failed, so one run reports both.
      - name: Site checks
        if: ${{ !cancelled() }}
        run: node tests/test-site.mjs
